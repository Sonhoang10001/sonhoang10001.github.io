<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graduation Invite Admin</title><style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:"Be Vietnam Pro",sans-serif}.app{display:grid;grid-template-columns:1fr 390px;min-height:100vh}.preview{padding:10px}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}iframe{width:100%;height:calc(100vh - 48px);border:1px solid #30343a;border-radius:10px;background:#111}.panel{padding:18px;background:#12151a;border-left:1px solid #30343a;overflow:auto}h1{margin:0 0 6px;color:#ffd36e;font-family:"Playfair Display",serif;font-size:26px}p{color:#c7c7c7;font-size:12px;line-height:1.55}label{display:block;color:#c9c9c9;font-size:11px;margin:11px 0 5px}input,textarea,select{width:100%;padding:9px 10px;border:1px solid #3b4048;border-radius:7px;background:#0f1216;color:#fff;font:inherit}textarea{min-height:64px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{width:100%;padding:11px;margin-top:9px;border:0;border-radius:8px;background:#f1c668;color:#431309;font-weight:800;cursor:pointer}.alt{background:transparent;border:1px solid #3b4048;color:#fff}.link{font-size:9px;word-break:break-all;color:#ffd36e;background:#0d1013;padding:8px;border-radius:7px;margin-top:5px}@media(max-width:980px){.app{grid-template-columns:1fr}.panel{border-left:0}.preview{min-height:780px}iframe{height:740px}}</style></head><body>
<div class="app"><main class="preview"><div class="ph"><b>Preview trực tiếp</b><select id="mode"><option value="vip">VIP 07:00–11:00</option><option value="photo">Chụp ảnh 11:00</option></select></div><iframe id="frame"></iframe></main><aside class="panel">
<h1>✎ Graduation Invite Editor</h1><p>Chỉnh tên khách và nội dung. Website tự tạo 2 link cá nhân hóa.</p>
<label>Tiêu đề dòng 1</label><input id="title1" value="Thư mời tham dự"><label>Tiêu đề dòng 2</label><input id="title2" value="lễ tốt nghiệp"><label>Tên Sơn</label><input id="fullName" value="HOÀNG HẢI SƠN"><label>Chuyên ngành</label><input id="major" value="DIGITAL MARKETING"><label>Dòng trân trọng mời</label><input id="inviteLabel" value="HẢI SƠN TRÂN TRỌNG MỜI"><label>Tên khách</label><input id="guest" value="Chị Trần Thu Hà"><label>Lời mời</label><input id="greeting" value="rất vui khi được mời bạn cùng tham dự"><label>Lời nhắn nhỏ</label><textarea id="note">Cùng Sơn khép lại một hành trình và mở ra nhiều hành trình lớn hơn.</textarea>
<div class="two"><div><label>Ngày</label><input id="eventDate" type="date" value="2026-09-15"></div><div><label>Giờ chụp ảnh</label><input id="photoTime" type="time" value="11:00"></div></div><div class="two"><div><label>VIP bắt đầu</label><input id="vipStart" type="time" value="07:00"></div><div><label>VIP kết thúc</label><input id="vipEnd" type="time" value="11:00"></div></div>
<label>Địa điểm</label><input id="venue" value="Hội trường MMH"><label>Địa chỉ</label><textarea id="address">Trung tâm Hội nghị Quốc gia, Cổng số 1, Đại lộ Thăng Long, Từ Liêm, Hà Nội</textarea>
<button onclick="copyLink('vip')">Sao chép link VIP</button><button onclick="copyLink('photo')">Sao chép link chụp ảnh</button><button class="alt" onclick="location.reload()">Khôi phục mặc định</button><label>Link VIP</label><div class="link" id="vipLink"></div><label>Link chụp ảnh</label><div class="link" id="photoLink"></div>
</aside></div><script>
const ids=['title1','title2','fullName','major','inviteLabel','guest','greeting','note','eventDate','photoTime','vipStart','vipEnd','venue','address'],E=id=>document.getElementById(id);
function P(){const p=new URLSearchParams();ids.forEach(id=>p.set(id,E(id).value));return p}function B(){return location.origin+location.pathname.replace(/\/[^/]*$/,'/')}function U(){const p=P().toString(),v=B()+'vip?'+p,ph=B()+'photo?'+p;E('vipLink').textContent=v;E('photoLink').textContent=ph;E('frame').src=(E('mode').value==='vip'?'vip.html':'photo.html')+'?'+p}ids.forEach(id=>E(id).addEventListener('input',U));E('mode').addEventListener('change',U);async function copyLink(t){const x=E(t==='vip'?'vipLink':'photoLink').textContent;try{await navigator.clipboard.writeText(x);alert('Đã sao chép link')}catch{prompt('Sao chép link này:',x)}}U();
</script></body></html>
