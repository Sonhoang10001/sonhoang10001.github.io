<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graduation Invitation Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--bg:#0a0c10;--panel:#11141a;--card:#171b22;--line:#2d333c;--gold:#efc66a;--soft:#ffd98a;--muted:#9fa6b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:"Be Vietnam Pro",sans-serif}.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:100vh}.preview-wrap{padding:14px}.top{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}.top h2{margin:0;font:600 17px "Playfair Display",serif}.pill{font-size:11px;color:#e8d2a6;border:1px solid #514328;border-radius:999px;padding:6px 10px}.frame-card{height:calc(100vh - 70px);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#050608;box-shadow:0 18px 60px rgba(0,0,0,.32)}iframe{width:100%;height:100%;border:0;background:#111}.panel{padding:16px 16px 24px;background:linear-gradient(180deg,#12151b,#0e1116);border-left:1px solid var(--line);overflow:auto}.brand{margin-bottom:16px}.brand h1{margin:0;color:var(--soft);font:600 26px "Playfair Display",serif}.brand p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.section{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.018)}.section h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#e8d4a7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:10px;color:#aeb4bf;margin:8px 0 5px}input,textarea,select{width:100%;padding:9px 10px;border:1px solid #343a44;border-radius:9px;background:#0b0e12;color:#fff;font:500 12px "Be Vietnam Pro",sans-serif;outline:none}input:focus,textarea:focus,select:focus{border-color:#8f7437;box-shadow:0 0 0 3px rgba(239,198,106,.08)}textarea{min-height:58px;resize:vertical}.actions{display:grid;gap:8px;margin-top:14px}button{padding:11px;border:0;border-radius:10px;font-weight:800;cursor:pointer}button.primary{background:linear-gradient(180deg,#f6d57f,#dfad4e);color:#481008}button.secondary{background:#181c23;border:1px solid #343a44;color:#fff}.link{font-size:9px;line-height:1.4;word-break:break-all;color:#eacb82;background:#090c10;padding:8px;border-radius:8px;margin-top:6px}@media(max-width:1000px){.app{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}.frame-card{height:760px}}
</style></head><body><div class="app"><main class="preview-wrap"><div class="top"><h2>Graduation Invitation Studio</h2><span class="pill">Live preview</span></div><div class="frame-card"><iframe id="frame"></iframe></div></main><aside class="panel">
<div class="brand"><h1>Hải Sơn 2026</h1><p>Chỉnh nội dung thư mời và tạo link cá nhân hóa cho từng khách.</p></div>
<div class="section"><h3>Người nhận</h3><label>Tên khách mời</label><input id="guest" value="Chị Trần Thu Hà"><label>Loại thư mời</label><select id="mode"><option value="vip">VIP • 07:00–11:00</option><option value="photo">Chụp ảnh • từ 11:00</option></select></div>
<div class="section"><h3>Nội dung chính</h3><label>Tiêu đề dòng 1</label><input id="title1" value="Thư mời tham dự"><label>Tiêu đề dòng 2</label><input id="title2" value="lễ tốt nghiệp"><label>Tên tốt nghiệp</label><input id="fullName" value="HOÀNG HẢI SƠN"><label>Chuyên ngành</label><input id="major" value="DIGITAL MARKETING"><label>Dòng trân trọng mời</label><input id="inviteLabel" value="HẢI SƠN TRÂN TRỌNG MỜI"><label>Lời mời</label><input id="greeting" value="rất vui khi được mời bạn cùng tham dự"><label>Lời nhắn nhỏ</label><textarea id="note">Cùng Sơn khép lại một hành trình và mở ra nhiều hành trình lớn hơn.</textarea></div>
<div class="section"><h3>Thời gian & địa điểm</h3><div class="grid2"><div><label>Ngày</label><input id="eventDate" type="date" value="2026-09-15"></div><div><label>Giờ chụp ảnh</label><input id="photoTime" type="time" value="11:00"></div></div><div class="grid2"><div><label>VIP bắt đầu</label><input id="vipStart" type="time" value="07:00"></div><div><label>VIP kết thúc</label><input id="vipEnd" type="time" value="11:00"></div></div><label>Địa điểm</label><input id="venue" value="Hội trường MMH"><label>Địa chỉ</label><textarea id="address">Trung tâm Hội nghị Quốc gia, Cổng số 1, Đại lộ Thăng Long, Từ Liêm, Hà Nội</textarea></div>
<div class="actions"><button class="primary" onclick="copyLink()">Sao chép link đang chọn</button><button class="secondary" onclick="location.reload()">Khôi phục mặc định</button></div><div class="link" id="currentLink"></div>
</aside></div><script>
const ids=['title1','title2','fullName','major','inviteLabel','guest','greeting','note','eventDate','photoTime','vipStart','vipEnd','venue','address'],E=id=>document.getElementById(id);
function P(){const p=new URLSearchParams();ids.forEach(id=>p.set(id,E(id).value));return p}function B(){return location.origin+location.pathname.replace(/\/[^/]*$/,'/')}
function U(){const mode=E('mode').value,p=P().toString(),url=B()+mode+'?'+p;E('currentLink').textContent=url;E('frame').src=(mode==='vip'?'vip.html':'photo.html')+'?'+p}
ids.forEach(id=>E(id).addEventListener('input',U));E('mode').addEventListener('change',U);
async function copyLink(){const x=E('currentLink').textContent;try{await navigator.clipboard.writeText(x);alert('Đã sao chép link')}catch{prompt('Sao chép link này:',x)}}U();
</script></body></html>
